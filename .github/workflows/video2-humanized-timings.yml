name: Video 2 Humanized Timings

on:
  push:
    branches: [video2-humanized-render]
  workflow_dispatch:

jobs:
  timings:
    runs-on: ubuntu-latest
    steps:
      - name: Download subtitles
        run: |
          curl -L --fail --retry 3 -o male.srt 'https://files2.heygen.ai/aws_pacific/avatar_tmp/458a9187568e4b77bd53fd6b853bef38/subtitles_98d723d436b54e1692f605f106b74dc2.srt?Expires=1786890393&Signature=npqtU98PKFk5X1ZsjRUB9Hg~WZra6JZur5xXoefRFtp9GwNlRcZNnKpRVvQSlY4JKKokTkCcL2xueToD9T2OQ9rnFsbLIkJg3m8b-GZkGBIM7TsMkUeq7B-1RoAbw75G22v3jdVPkw7fSduXI2sI5wvCaxBUzCxraVKbGNsfhnM3PeZrBTkJXsIsG1qX-bB~QilBSVO3kPTlmOVU-UPtpY4HgmyJs8cNvpGlgXR8k-pSchpUzcN7u-V~fl1M3BwWufuywmVMYGwCY6m5795oodXZjzbYXLzsZ8jyQpYhv22Df2RLn4d6UQNLPSDVXkp990yiwn24c9b2sUP-391JCQ__&Key-Pair-Id=K38HBHX5LX3X2H'
          curl -L --fail --retry 3 -o female.srt 'https://files2.heygen.ai/aws_pacific/avatar_tmp/458a9187568e4b77bd53fd6b853bef38/subtitles_9adb7a7a2dc24411925c5b209c16a283.srt?Expires=1786890413&Signature=Yk~UMOP5SEn2TYq7WC3PTXqoK8CAwuXAJ3xU3pPh61xqaj3eQqJx6yH4NbkM8prBUWSwjNO5HD5cd~LP7YgbaymC0JovPI-AEyr5L~6vpD-ymXkvvAL1cszcj6gnghqug5th0tgZIttrYnBd4q4xqctoJzbOsN-ghZxy1Jcm9sZMqgBBSixNBiuGmCQhmcF5NBUwXNawC2uc3~P6VrmQ0cmGBO7c4za~iWpjG-CEIf5gMO-fjDNhcXdCbRVKDod7b6xRC915ywCETpzGJcEQ6Wvq-GgzXhizvT7jSULbL9~G9PQYV-FByV2ZotiFkNglMOC~MoWnutRlkRUZWDriQg__&Key-Pair-Id=K38HBHX5LX3X2H'

      - name: Build exact dialogue timings
        run: |
          cat > timing.py <<'PY'
          import re, difflib, json
          TURNS=[
          (1,'m',"You ever sit there at night thinking, man... I really need to get my whole life together?"),(1,'f',"Tonight?"),(1,'m',"Well... eventually."),(1,'f',"Good. Because tonight you're exhausted, overwhelmed, and being a little dramatic."),(1,'m',"A little?"),(1,'f',"I'm being supportive."),
          (2,'m',"I think that's where people get stuck. They start thinking about forever. Forever sober. Forever disciplined. Never screwing up again."),(2,'f',"Forever is huge. Try today."),(2,'m',"Just today?"),(2,'f',"Today is plenty. What do you need to do before you go to sleep without making your life worse?"),
          (3,'m',"Wanting a better life matters."),(3,'f',"Absolutely. But your actions eventually need to find out about this wonderful new plan."),(3,'m',"So make the call. Go home when you know you should go home. Show up tomorrow. Tell the truth."),(3,'f',"Desire gets you pointed in the right direction."),(3,'m',"And your feet still have to move."),
          (4,'m',"One thing I've learned is that things get dangerous when you disappear into your own head."),(4,'f',"Especially when your brain starts saying, don't tell anybody. I can handle this myself. How'd that strategy work last time?"),(4,'m',"Rude. Accurate, though."),(4,'f',"Call somebody before you do the thing you already know you're going to regret. Not afterward."),
          (5,'m',"And sometimes you have to admit you can't control everything."),(5,'f',"He hates this section."),(5,'m',"I really do."),(5,'f',"I know."),(5,'m',"You don't have to have every spiritual answer figured out. Call it God. Faith. Purpose. Your Higher Power. Something bigger than whatever emotion happens to be screaming the loudest right now."),(5,'f',"Because not every feeling deserves a vote."),(5,'m',"Ask for enough direction to do the next right thing. That's enough for today."),
          (6,'m',"At the end of the day, take a minute and be honest with yourself. What did I do right? Where was I full of crap? Did I hurt somebody? Is there something I need to apologize for or make right?"),(6,'f',"And then fix what you can. Don't turn self-reflection into a three-hour meeting about how terrible you are."),(6,'m',"Be accountable."),(6,'f',"Not cruel."),
          (7,'m',"You're still going to have bad days."),(7,'f',"You'll get angry. Tired. Lonely. Somebody will get on your last nerve."),(7,'m',"You might even screw something up."),(7,'f',"But one bad decision does not require another one. A bad day doesn't need a sequel."),(7,'m',"Get honest. Reach out. Correct course. And keep moving."),
          (8,'m',"Eventually something else happens. You stop spending every waking minute thinking about your own problems."),(8,'f',"Which is healthy, because that room gets crowded."),(8,'m',"You help somebody. You check on somebody. You encourage the person who's a few steps behind you."),(8,'f',"And suddenly your worst years aren't completely wasted. They taught you something another person might need."),
          (9,'m',"That's what a comeback usually looks like. Not some giant movie moment. You get through today differently. Then tomorrow. Then another day."),(9,'f',"And after a while, you start collecting evidence."),(9,'m',"Evidence of what?"),(9,'f',"That maybe you're not that old version of yourself anymore. You're just still used to talking about yourself like you are."),
          (10,'m',"So no. You don't need a whole new life tonight."),(10,'f',"You need some honesty."),(10,'m',"Some willingness."),(10,'f',"People you can call."),(10,'m',"Something bigger than yourself."),(10,'f',"And one decent decision."),(10,'m',"Today."),
          (11,'f',"Of course, tomorrow morning you're probably going to wake up and feel absolutely zero motivation."),(11,'m',"Can I enjoy this victory for like ten seconds?"),(11,'f',"Nope.")]
          def norm(s): return re.findall(r'[a-z0-9]+',s.lower().replace('’',"'"))
          def sec(t):
              h,m,r=t.split(':'); s,ms=r.split(','); return int(h)*3600+int(m)*60+int(s)+int(ms)/1000
          def parse(path):
              words=[]
              for block in re.split(r'\n\s*\n',open(path,encoding='utf8').read().strip()):
                  ls=block.splitlines(); ti=next((i for i,x in enumerate(ls) if '-->' in x),None)
                  if ti is None: continue
                  a,b=[x.strip() for x in ls[ti].split('-->')]; toks=norm(' '.join(ls[ti+1:])); st,en=sec(a),sec(b)
                  if not toks: continue
                  d=max(.001,en-st)
                  for j,w in enumerate(toks): words.append((w,st+d*j/len(toks),st+d*(j+1)/len(toks)))
              return words
          def get_ranges(sp,path):
              texts=[t for _,s,t in TURNS if s==sp]; target=[]; spans=[]
              for t in texts: a=len(target); target+=norm(t); spans.append((a,len(target)))
              src=parse(path); sw=[x[0] for x in src]; sm=difflib.SequenceMatcher(a=target,b=sw,autojunk=False); mp={}
              for tag,a1,a2,b1,b2 in sm.get_opcodes():
                  if tag=='equal':
                      for k in range(a2-a1): mp[a1+k]=b1+k
                  elif tag in ('replace','insert') and a2>a1 and b2>b1:
                      for k in range(a1,a2):
                          frac=(k-a1)/max(1,a2-a1-1); mp[k]=min(b2-1,b1+round(frac*max(0,b2-b1-1)))
              out=[]; last=0
              for a,b in spans:
                  ids=[mp[i] for i in range(a,b) if i in mp]; i0,i1=min(ids),max(ids); st=max(0,src[i0][1]-.06); en=src[i1][2]+.08
                  if st<last: st=last
                  out.append((st,en)); last=en
              print(sp,'ratio',sm.ratio()); return out
          mr=get_ranges('m','male.srt'); fr=get_ranges('f','female.srt'); mi=fi=0; elapsed=0.0; timeline=[]
          for idx,(scene,sp,text) in enumerate(TURNS,1):
              if sp=='m': st,en=mr[mi]; mi+=1
              else: st,en=fr[fi]; fi+=1
              dur=en-st; start=elapsed; end=start+dur; timeline.append({'index':idx,'scene':scene,'speaker':sp,'text':text,'start':start,'end':end}); elapsed=end+.2
          def stamp(t):
              ms=round(t*1000); h=ms//3600000; ms%=3600000; m=ms//60000; ms%=60000; s=ms//1000; z=ms%1000; return f'{h:02d}:{m:02d}:{s:02d},{z:03d}'
          with open('Video2_HUMANIZED_TIMINGS.json','w') as f: json.dump({'duration':elapsed,'turns':timeline},f,indent=2)
          with open('Video2_HUMANIZED_DIALOGUE.srt','w') as f:
              for x in timeline: f.write(f"{x['index']}\n{stamp(x['start'])} --> {stamp(x['end'])}\n{x['text']}\n\n")
          print('timeline',elapsed)
          PY
          python3 timing.py

      - name: Upload timing artifact
        uses: actions/upload-artifact@v4
        with:
          name: video2-humanized-timings
          path: |
            Video2_HUMANIZED_TIMINGS.json
            Video2_HUMANIZED_DIALOGUE.srt
